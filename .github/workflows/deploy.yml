name: deploy-docs

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: vp install && vp run dev:setup

      - name: Build with VitePress
        run: vp run build:all && vp run build:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-stack:
    name: Deploy fatestack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Set up pnpm for Wrangler
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.6'
          run_install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check and build fatestack
        run: vp run test:stack && vp run build:stack

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: pages deploy sites/stack/dist/client --project-name=fatestack --branch=main

name: template

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fate
          POSTGRES_PASSWORD: echo
          POSTGRES_USER: fate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.template }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        template:
          - cloudflare
          - graphql
          - graphql-client
          - void
          - drizzle
          - http
          - prisma

    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Install browser
        run: vp exec playwright install --with-deps chromium

      - name: Test ${{ matrix.template }} template
        run: scripts/test-fate-template.sh ${{ matrix.template }}

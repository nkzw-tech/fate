packages:
  - client
  - server

allowBuilds:
  '@swc/core': true
  better-sqlite3: false
  drizzle-kit: true
  esbuild: true
  sharp: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core'
  - vite-plus

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - drizzle-kit
  - esbuild
  - msgpackr-extract
  - unrs-resolver

overrides:
  better-auth: 1.7.14
  drizzle-orm: 0.45.4
  kysely: 0.28.17
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

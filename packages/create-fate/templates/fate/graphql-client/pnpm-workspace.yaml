packages:
  - .

allowBuilds:
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core'
  - vite-plus

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - msgpackr-extract
  - sharp
  - workerd

overrides:
  better-auth: 1.7.14
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

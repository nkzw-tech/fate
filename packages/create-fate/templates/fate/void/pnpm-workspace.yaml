packages:
  - .

allowBuilds:
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0

minimumReleaseAgeExclude:
  - '@nkzw/*'
  - '@void/*'
  - '@voidzero-dev/*'
  - void
  - vite-plus

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - msgpackr-extract
  - sharp
  - workerd

overrides:
  '@cloudflare/workers-types': 5.20261117.1
  better-auth: 1.7.25
  drizzle-orm: 0.45.4
  kysely: 0.29.9
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

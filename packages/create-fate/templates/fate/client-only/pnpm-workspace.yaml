packages:
  - .

allowBuilds:
  better-sqlite3: false
  esbuild: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0

minimumReleaseAgeExclude:
  - '@nkzw/*'
  - '@void/*'
  - '@voidzero-dev/*'
  - void
  - vite-plus

overrides:
  vite: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

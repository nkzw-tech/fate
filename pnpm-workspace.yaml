packages:
  - example/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3@12.11.1: true
  better-sqlite3@13.0.3: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.1
  '@types/react-dom': 19.3.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  vitest: 5.1.1
  '@vitest/coverage-v8': 5.1.1

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
  - workerd

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

minimumReleaseAgeExclude:
  - '@nkzw/*'
  - '@void/*'
  - '@voidzero-dev/*'
  - 'void'
  - vite-plus
  - '@cloudflare/workers-types@5.20261117.1 || 5.20261125.1'
  - '@hono/node-server@2.1.9'
  - '@lucide/vue@1.74.0'
  - cf@1.0.0-rc.0
  - lucide-react@1.74.0
